services:
  api:
    build: .
    container_name: ecommerce-api

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      # Override whatever .env points at: inside the network these are service
      # names, and the replicaSet parameter is required for checkout to work.
      MONGO_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0&retryWrites=true
      REDIS_URL: redis://redis:6379
      # CRAWLER_URL / CRAWLER_API_KEY come from .env and point at the Cloud Run
      # crawler. To use the local one instead (see the crawler service below),
      # set CRAWLER_URL=http://crawler:8080 here.

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - .:/app
      - api-node-modules:/app/node_modules

    command: npm run dev
    restart: unless-stopped

  # Drains the BullMQ email queue. The API only enqueues jobs; without this
  # service password-reset mails are queued and never sent.
  worker:
    build: .
    container_name: ecommerce-worker

    env_file:
      - .env

    environment:
      MONGO_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0&retryWrites=true
      REDIS_URL: redis://redis:6379

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - .:/app
      - api-node-modules:/app/node_modules

    command: npx nodemon worker.js
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: ecommerce-mongo

    ports:
      - "27017:27017"

    # Single-node replica set rather than a plain mongod: transactions need an
    # oplog, and checkout wraps its stock writes in one.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status(); quit(0); } catch(e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(0);
          }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  redis:
    image: redis:8
    container_name: ecommerce-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  # Local copy of Crawler-Service (the `crawler` git submodule). Search normally
  # uses the deployed Cloud Run crawler, so this only starts when asked for:
  #   docker compose --profile local-crawler up -d
  crawler:
    profiles: ["local-crawler"]
    build: ./crawler
    container_name: ecommerce-crawler
    environment:
      API_KEYS: ${CRAWLER_API_KEY}
      MAX_CONCURRENT_SESSIONS: 2
    shm_size: "1gb"   # Chromium crashes tabs with Docker's default 64 MB
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  mongo-data:
  api-node-modules:
