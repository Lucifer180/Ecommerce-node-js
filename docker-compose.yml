services:
  api:
    build: .
    container_name: ecommerce-api

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      MONGO_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0&retryWrites=true
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200

    depends_on:
      - mongo
      - redis
      - elasticsearch

    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    
    command: npm run dev
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: ecommerce-mongo

    ports:
      - "27017:27017"

    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status(); quit(0); } catch(e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(0);
          }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  redis:
    image: redis:8
    container_name: ecommerce-redis

    ports:
      - "6379:6379"

    restart: unless-stopped
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    
    ports:
      - "9200:9200"

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

    restart: unless-stopped

  # worker:
