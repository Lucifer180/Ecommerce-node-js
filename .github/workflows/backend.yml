name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # mongodb-memory-server downloads a mongod binary on first run; caching it
      # keeps the test job from re-fetching ~100MB on every push.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # No secrets needed: tests/setup/env.js supplies dummy credentials and the
      # suite runs against an in-memory replica set.
      - name: Run tests
        run: npm test
