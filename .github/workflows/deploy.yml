name: Deploy Backend

# Deploys only after Backend CI has gone green on the same commit. Triggering
# straight off `push` meant a commit with failing tests still shipped.
on:
    workflow_run:
        workflows: ["Backend CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-backend
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.ORACLE_HOST }}
                  username: ${{ secrets.ORACLE_USER }}
                  key: ${{ secrets.ORACLE_SSH_KEY }}
                  command_timeout: 20m
                  script: |
                      set -e
                      cd /home/opc/Ecommerce-node-js

                      # Remember where we are so a failed health check can go back.
                      PREVIOUS_SHA=$(git rev-parse HEAD)

                      git fetch --all
                      git reset --hard origin/main
                      npm ci --omit=dev
                      pm2 reload ecosystem.config.js --update-env
                      pm2 save

                      # On the 1 GB box npm ci pushes memory into swap, and Node can
                      # then take well over 3 s to start listening. A single check
                      # after a fixed sleep rolled back healthy releases, so poll for
                      # up to 60 s instead.
                      HEALTHY=no
                      for attempt in $(seq 1 30); do
                        if curl -fs http://127.0.0.1:5000/health; then HEALTHY=yes; break; fi
                        sleep 2
                      done

                      if [ "$HEALTHY" != yes ]; then
                        echo "Health check failed — rolling back to $PREVIOUS_SHA"
                        pm2 logs --lines 40 --nostream || true
                        git reset --hard "$PREVIOUS_SHA"
                        npm ci --omit=dev
                        pm2 reload ecosystem.config.js --update-env
                        exit 1
                      fi

                      echo "Deploy healthy at $(git rev-parse --short HEAD)"
